# BBO SPDC Simülasyon Parametreleri

crystal:
  material: "BBO"
  type: 2
  thickness_mm: 2.00
  thickness_tolerance_mm: 0.05
  cut_angle_deg: 41.8
  cut_angle_tolerance_deg: 0.5

pump:
  wavelength_nm: 405
  polarization_deg: 45
  beam_waist_um: 150.0             # Kristal merkezindeki pompa ışın beli (w_p)

spdc:
  signal_wavelength_nm: 810
  idler_wavelength_nm: 810
  is_degenerate: true

filters:
  signal_bandwidth_nm: 10

fiber:                             # <-- Baştaki boşluk kaldırıldı (en sola yaslı)
  type: "SMF"                      # MMF de olabilir
  mode_radius_um: 2.5              # SMF için ~2.5 µm (MMF ise ~25.0 olur)
  collection_waist_um: 150.0       # Kristal düzlemindeki toplama modu yarıçapı (w_f)
  distance_from_crystal_mm: 100.0  # Fiberin kristale uzaklığı

detector:
  model: "Excelitas SPCM-AQRH-14-TR-BR1"
  quantum_efficiency: 0.65         # 810 nm'deki kuantum verimliliği (~%65)
  dark_count_rate_hz: 100          # Karanlık sayım gürültüsü