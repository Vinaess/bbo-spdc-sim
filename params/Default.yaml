# BBO SPDC Simülasyon Parametreleri

crystal:
  material: "BBO"
  type: 2                         
  thickness_mm: 2.00              
  thickness_tolerance_mm: 0.05    
  cut_angle_deg: 41.8             
  cut_angle_tolerance_deg: 0.5    

pump:
  wavelength_nm: 405
  polarization_deg: 45            

spdc:
  signal_wavelength_nm: 810
  idler_wavelength_nm: 810
  is_degenerate: true

filters:
  signal_bandwidth_nm: 10

  fiber:
  type: "SMF"             # YARIN ÖĞRENİNCE SADECE BURAYI "MMF" YAPABİLİRSİN
  mode_radius_um: 2.5     # SMF için çekirdek yarıçapı genelde 2.5 µm'dir (MMF ise ~25.0 olur)
  distance_from_crystal_mm: 100.0  # Fiberin kristale uzaklığı

detector:
  model: "Excelitas SPCM-AQRH-14-TR-BR1"
  quantum_efficiency: 0.65  # Excelitas'ın 810 nm'deki yakalama başarısı (~%65)
  dark_count_rate_hz: 100   # Karanlık sayım gürültüsü